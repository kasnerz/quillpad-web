<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quillpad</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" id="theme-color" content="#f2f5ed">

<!-- Inline and blocking on purpose. js/theme.js owns the theme, but it is a
     module, so it runs after the document is parsed — by which time a dark page
     would already have flashed white. This sets the same attribute the same way,
     early enough that the first paint is the right colour. -->
<script>
(function () {
  var stored = null;
  try { stored = localStorage.getItem("quillpad-theme"); } catch (e) {}
  var dark = stored === "dark" || (stored !== "light" &&
    matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.getElementById("theme-color").content = dark ? "#151a11" : "#f2f5ed";
})();
</script>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
<div class="topbar-inner">
  <h1 class="brand">
    <!-- A real link rather than a click handler, so middle-click and "open in
         new tab" behave. It points at the root, which is where the app already
         is, so following it reloads everything from scratch — the one recovery
         this UI has no other button for.
         The label is spelled out because .brand-name is hidden on a narrow
         window, which would otherwise leave the link with no accessible name. -->
    <a class="brand-link" href="/" aria-label="Quillpad">
      <img class="brand-logo" src="icon.svg" alt="" width="30" height="30">
      <span class="brand-name">Quillpad</span>
    </a>
  </h1>

  <nav class="views">
    <!-- The labels are hidden on narrow screens, so the titles are what is
         left to name these. -->
    <button class="view-tab active" data-view="notes" title="Notes" aria-label="Notes">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11l-5 5H4z"/><path d="M20 16h-5v5"/></svg>
      <span>Notes</span>
    </button>
    <button class="view-tab" data-view="archive" title="Archive" aria-label="Archive">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/></svg>
      <span>Archive</span>
    </button>
    <button class="view-tab" data-view="trash" title="Trash" aria-label="Trash">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      <span>Trash</span>
    </button>
  </nav>

  <div class="topbar-right">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search-input" placeholder="Search notes" autocomplete="off">
    </div>
    <!-- Icon and label are filled in by js/theme.js, which knows which theme is
         on screen and so which one the click leads to. -->
    <button class="icon-btn" id="theme-btn"></button>
    <span id="sync-dot" class="sync-dot" title="Live updates"></span>
  </div>
</div>
</header>

<main class="main">
  <div class="composer" id="composer">
    <span>Take a note…</span>
    <div class="composer-actions">
      <button class="icon-btn" id="composer-list" title="New list">
        <svg viewBox="0 0 24 24"><path d="M4 6h2v2H4zM4 11h2v2H4zM4 16h2v2H4zM9 7h11M9 12h11M9 17h11"/></svg>
      </button>
    </div>
  </div>

  <div class="trash-bar" id="trash-bar" hidden>
    <span>Notes in the trash are deleted after 7 days.</span>
    <button class="text-btn danger" id="empty-trash">Empty trash</button>
  </div>

  <section class="section" id="section-pinned" hidden>
    <h2 class="section-label">Pinned</h2>
    <div class="grid" id="grid-pinned"></div>
  </section>

  <section class="section" id="section-others">
    <h2 class="section-label" id="others-label" hidden>Others</h2>
    <div class="grid" id="grid-others"></div>
  </section>

  <p class="empty" id="empty-state" hidden></p>
</main>

<!-- Editor overlay -->
<div class="overlay" id="editor-overlay" hidden>
  <div class="editor" id="editor" role="dialog" aria-modal="true">
    <!-- Images sit above the text, as they do on a card and in Quillpad. -->
    <div id="editor-attachments" class="editor-attachments" hidden></div>

    <input type="text" id="editor-title" class="editor-title" placeholder="Title">

    <textarea id="editor-content" class="editor-content" placeholder="Take a note…" rows="6"></textarea>

    <div id="editor-list" class="editor-list" hidden></div>
    <button id="editor-add-item" class="list-add" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>List item</span>
    </button>

    <div class="editor-footer">
      <div class="editor-tools">
        <button class="icon-btn" id="editor-pin" title="Pin note">
          <svg viewBox="0 0 24 24"><path d="M15 3l6 6-3 1-4 4-1 5-6-6 5-1 4-4z"/><path d="M7 17l-4 4"/></svg>
        </button>
        <button class="icon-btn" id="editor-color" title="Colour">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16"/></svg>
        </button>
        <button class="icon-btn" id="editor-toggle-type" title="Convert to checkboxes">
          <svg viewBox="0 0 24 24"><path d="M4 6h2v2H4zM4 11h2v2H4zM4 16h2v2H4zM9 7h11M9 12h11M9 17h11"/></svg>
        </button>
        <button class="icon-btn" id="editor-markdown" title="Markdown">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 15V9l3 3 3-3v6M17 9v4M15 12l2 2 2-2"/></svg>
        </button>
        <button class="icon-btn" id="editor-image" title="Add image">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 16l-5-5-4 4-2-2-4 4"/></svg>
        </button>
        <!-- Multiple, images only: the server refuses anything else anyway. -->
        <input type="file" id="editor-file" accept="image/*" multiple hidden>
        <button class="icon-btn" id="editor-archive" title="Archive">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11h14V8M10 12h4"/></svg>
        </button>
        <button class="icon-btn danger" id="editor-delete" title="Move to trash">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>
      </div>
      <button class="text-btn" id="editor-close">Close</button>
    </div>
  </div>
</div>

<!-- Vendored as plain scripts: both ship as UMD globals, not ES modules. -->
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
